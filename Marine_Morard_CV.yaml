# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
cv:
  name: Marine MORARD
  headline: Senior Site Reliability Engineer (SRE) — Cloud Souverain, Kubernetes (KaaS) & Services Managés
  location: Île-de-France (Orphin / Paris)
  email: marine.morard@gmail.com
  social_networks:
    - network: LinkedIn
      username: marine-morard
    - network: GitHub
      username: hantael
  sections:
    Profil:
      - >-
        Ingénieure SRE Senior avec près de 10 ans d'expérience en production sur des infrastructures cloud souveraines et critiques (3DS Outscale, S3NS — SecNumCloud, ISO 27001, HDS). Profil très terrain orienté gestion d'incidents majeurs (P0/P1), fiabilité de plateformes Kubernetes (CAPI, KaaS) et IaaS, résilience multi-DC et automatisation (Python, Bash, Nix/NixOS, Terraform, SaltStack).

    Expériences professionnelles:
      - company: Thales Cloud Sécurisé (S3NS)
        position: Lead SRE Compute & AI Infrastructure
        start_date: 2026-01
        end_date: present
        location: Paris
        summary: "*Joint-venture Thales & Google Cloud*"
        highlights:
          - MCO/MCS et haute disponibilité en production sur un périmètre critique Compute (GCE, Borg, GKE) et plateformes IA (Vertex AI, Gemini 1P & 3P, instances GPU A3 de la plateforme interne d'outillage IA).
          - Astreintes 24/7 et résolution d'incidents majeurs (P0/P1) en collaboration technique directe avec les équipes Google (R&D/ops, synchronisation multi-fuseaux US) ; conduite des post-mortems et plans d'amélioration continue.
          - Automatisation d'opérations (Python, Bash) pour réduire le toil ; prototypage de workflows assistés par IA (LLM, protocole MCP) pour accélérer le diagnostic d'incidents.
          - Encadrement technique et mentoring au sein d'une équipe de 9 ingénieurs (CDI et prestataires) ; accompagnement à la montée en compétences d'équipes internationales sur des périmètres similaires (déplacements à l'étranger).

      - company: Thales Cloud Sécurisé (S3NS)
        position: Ingénieure SRE KaaS / Compute
        start_date: 2024-01
        end_date: 2025-12
        location: Paris
        highlights:
          - Construction, MCO et troubleshooting en production d'une plateforme KaaS souveraine en *full GitOps* (~60 à 90 clusters multi-DC / multi-zones) via Kubernetes Cluster API (CAPI), Nix / NixOS, FluxCD, Woodpecker CI / Gitea et Prometheus / Grafana.
          - "Accompagnement transverse SRE : déploiement d'un cluster de base de données résilient (MariaDB / MaxScale) sur 3 clusters Kubernetes dans 3 datacenters sous contraintes applicatives (iTop)."
          - Définition des SLI/SLO, runbooks et scripts Bash d'automatisation pour le bootstrap et les exercices de résilience / redémarrage à froid DC (ISON, DiRT).

      - company: 3DS Outscale (Dassault Systèmes)
        position: Lead SRE Marketplace
        start_date: 2023-01
        end_date: 2023-12
        location: Saint-Cloud
        summary: "*Cloud souverain qualifié SecNumCloud, ISO 27001 et HDS*"
        highlights:
          - Construction *from scratch* de l'infrastructure de la plateforme Marketplace (architecture, déploiement Kubernetes, Terraform, SaltStack, monitoring et alerting de production).
          - "Première expérience de Lead SRE : structuration des standards d'exploitation et accompagnement technique au sein d'un binôme dédié."

      - company: 3DS Outscale (Dassault Systèmes)
        position: SRE — Ingénieure Système (Équipe COS — Continuity of Service)
        start_date: 2017-01
        end_date: 2022-12
        location: Saint-Cloud
        highlights:
          - MCO/MCS multi-régions (~8 régions publiques multi-AZ Europe/US/Asie, SecNumCloud et clouds privés dédiés défense) sur IaaS / TINA OS, S3 (Ceph puis Scality), IAM et Billing ; support N2/N3 et diagnostic bas niveau (Linux, QEMU/VMware, PostgreSQL, Nginx, HAProxy).
          - Pilotage et automatisation de migrations critiques de ressources clientes lors de changements de salles datacenter, ainsi que des communications de maintenance client (Python, Mailchimp puis Brevo).
          - Automatisation des déploiements de plateformes publiques/privées (SaltStack, Terraform, Python, Bash, GitLab CI, Consul) ; rôles de Git Master et Release Master.

    Compétences techniques:
      - label: Cloud Souverain, KaaS & IaaS
        details: Kubernetes (CAPI, GKE), Compute (GCE, Borg), IaaS (TINA OS, S3 Ceph/Scality, EC2, IAM, QEMU, VMware), GPU (A3, fGPUs), Vertex AI / Gemini, SecNumCloud / ISO 27001 / HDS.
      - label: SRE, Observabilité & BDD
        details: MCO/MCS, astreintes 24/7, incidents P0/P1, SLI/SLO/SLA, post-mortems, DiRT/ISON, Prometheus, Grafana (alerting), Zabbix, PostgreSQL, MariaDB / MaxScale, Nginx, HAProxy, Consul.
      - label: IaC, GitOps & Automatisation
        details: Python, Bash, Linux, Nix / NixOS, Terraform, SaltStack, Ansible, FluxCD, GitLab CI, Woodpecker CI / Gitea, Git, workflows IA & agents (LLM, protocole MCP, n8n).
      - label: Langues
        details: Français (natif), Anglais (courant technique et professionnel).

    Formation & Certifications:
      - institution: École des Technologies Numériques Avancées (ETNA)
        area: Systèmes, Réseaux et Sécurité (Niveau 7 / Bac+5)
        degree: Architecte
        date: 2019
        highlights:
          - "Parcours antérieur : Chargée de Projet SI (ETNA, 2016–2018) · Expert en Technologies de l'Information (EPITECH, 2014–2016) · Baccalauréat STI2D SIN — Mention Bien (Lycée Louis Jouvet, 2014)."
          - "Formation continue : Management (Thales), préparation certification Google Cloud Generative AI Leader, écosystème Kubernetes & AIOps."

    Centres d'intérêt:
      - "Apiculture (14 ruches, récolte et mise en pot), impression 3D, domotique, automatisation du quotidien (workflows IA, apps perso) et jeux de factory/stratégie (Factorio, Frostpunk, Cities: Skylines)."

design:
  theme: engineeringclassic
  page:
    size: a4
    top_margin: 1.2cm
    bottom_margin: 1.2cm
    left_margin: 1.2cm
    right_margin: 1.2cm
    show_footer: false
    show_top_note: false
  typography:
    alignment: left
    font_size:
      body: 9.1pt
      name: 22pt
      headline: 9.6pt
      connections: 9pt
      section_titles: 1.2em
    line_spacing: 0.49em
  header:
    space_below_name: 0.16cm
    space_below_headline: 0.16cm
    space_below_connections: 0.3cm
  section_titles:
    space_above: 0.28cm
    space_below: 0.14cm
  sections:
    space_between_regular_entries: 0.58em
    space_between_text_based_entries: 0.2em
    show_time_spans_in:
      - expériences_professionnelles
  entries:
    date_and_location_width: 5.7cm
    space_between_columns: 0.25cm
    summary:
      space_above: 0.05cm
    highlights:
      space_above: 0.06cm
      space_between_items: 0.06cm
  templates:
    single_date: MONTH_NAME YEAR
    time_span: "(HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS)"

locale:
  language: french
  present: Présent
  phrases:
    degree_with_area: DEGREE AREA

