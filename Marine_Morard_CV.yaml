      space_above: 0.04cm
    highlights:
      space_above: 0.05cm
      space_between_items: 0.055cm
  templates:
    single_date: MONTH_NAME YEAR
    time_span: "(HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS)"

